<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Leads Finder - Data Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Truck Leads Finder</h1>
            <button id="loadDataBtn" class="btn">Load Data from Google Sheets</button>
            <div class="search-container">
                <input type="text" id="searchBox" placeholder="Search by company name..." class="search-input">
                <button id="clearSearchBtn" class="btn-small">Clear</button>
            </div>
            <div id="status" class="status"></div>
        </header>

        <div id="map"></div>

        <div id="data-info" class="data-info">
            <h3>Instructions:</h3>
            <ol>
                <li>Set up Google Sheets API credentials</li>
                <li>Set up Google Maps API key</li>
                <li>Update config.js with your API keys and Sheet ID</li>
                <li>Click "Load Data" to fetch and display locations</li>
            </ol>
        </div>
    </div>

    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyArUlpNWL_BCWTyGxnDe8FAKv8jADkB7OU&callback=initMap&libraries=places" async defer></script>

    <!-- App Configuration -->
    <script src="config.js"></script>

    <!-- Main Application -->
    <script src="app.js"></script>
</body>
</html>
